description: >-
  American Woodmark Corporation (NASDAQ: AMWD) is one of the largest
  manufacturers of kitchen, bath and home organization cabinetry in the United
  States, headquartered in Winchester, Virginia and operating manufacturing
  plants and service centers across the US and Mexico. It sells through home
  centers, homebuilders and independent dealers under brands including
  Timberlake, Waypoint Living Spaces, Shenandoah and 1951 Cabinetry. It is a
  manufacturer rather than a software vendor and runs no developer program: it
  publishes no API documentation, no OpenAPI, AsyncAPI, GraphQL or WSDL
  contract, and no SDKs. The only machine-readable contract it serves publicly
  is the OpenID Connect discovery document for its identity provider at
  id.woodmark.com, which fronts its dealer Online Ordering application.
  Trading-partner integration is conducted over ANSI ASC X12 EDI under bilateral
  trade agreements rather than through a public HTTP API.
