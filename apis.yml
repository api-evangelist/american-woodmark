apis:
  - aid: american-woodmark:american-woodmark-identity
    name: American Woodmark Identity Provider
    tags:
      - Identity
      - OpenID Connect
      - OAuth
      - Authentication
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://id.woodmark.com
    humanURL: https://id.woodmark.com
    description: >-
      American Woodmark's OpenID Connect / OAuth 2.0 authorization server, an
      IdentityServer deployment that authenticates users of the company's dealer
      and customer applications including the Online Ordering portal at
      go.woodmark.com. It serves a complete, anonymous OIDC discovery document
      and JWKS. It advertises the authorization_code, client_credentials,
      refresh_token, implicit, password and RFC 8628 device_code grants, PKCE
      with S256, RS256 ID tokens, token introspection and revocation, and both
      front-channel and back-channel logout. There is no public client
      registration (no RFC 7591 registration_endpoint) and no protected-resource
      metadata (RFC 9728), so no resource server is discoverable and credentials
      must be issued by American Woodmark out of band.
    properties:
      - type: OpenIDConnect
        url: https://id.woodmark.com/.well-known/openid-configuration
      - type: Authentication
        url: authentication/american-woodmark-authentication.yml
      - type: OAuthScopes
        url: scopes/american-woodmark-scopes.yml
