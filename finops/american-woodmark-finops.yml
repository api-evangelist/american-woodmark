description: >-
  FinOps scaffold for American Woodmark. The company invoices retail and homebuilder customers under standard building-products trade terms rather than a metered API. FOCUS mappings remain conceptual.
notes: >-
  American Woodmark is a kitchen and bath cabinet manufacturer; it does not publish a public API developer portal with documented pricing or rate limits. Trading-partner integrations with home centers and homebuilders are governed by EDI and bilateral agreements. Reconcile if a public API is launched.
