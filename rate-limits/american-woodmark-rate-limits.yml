description: >-
  American Woodmark publishes no API rate limits. It has no developer
  documentation, no API reference and no public API contract other than an
  OpenID Connect discovery document, which carries no throttling metadata.
  There is no documented window, quota, burst allowance or rate-limit response
  header anywhere on its hosts.
limit_count: 0
limits: []
headers: []
headers_note: >-
  No RateLimit-*, X-RateLimit-* or Retry-After behaviour is documented, and
  none was observed: there is no public unauthenticated API endpoint to observe
  one on.
notes: >-
  Upgraded 2026-09-02 from a `generated` bulk-sweep scaffold to a `searched`
  honest zero. The previous version carried a placeholder limits[] entry
  ("Undocumented - bilateral agreement") and asserted 429/503 response codes
  that American Woodmark has never published. Both were removed — an invented
  limit and an invented status code are worse than a recorded absence.
  Trading-partner throughput is governed by EDI trade agreements, not by an
  HTTP rate limit.
