description: >-
  Well-known document probe for American Woodmark. The corporate host
  www.americanwoodmark.com serves no /.well-known/ documents at all (it does not
  even serve robots.txt). The company's identity provider at id.woodmark.com —
  the same registrable domain that www.woodmark.com redirects from to
  www.americanwoodmark.com — DOES serve a complete, anonymous OpenID Connect
  discovery document plus its JWKS. That pair is the only machine-readable
  contract American Woodmark publishes anywhere.
ownership_note: >-
  woodmark.com is American Woodmark's own domain: https://www.woodmark.com/
  returns an HTTP 200 whose title is "American Woodmark" and which redirects to
  www.americanwoodmark.com, and the company's GitHub organization
  (github.com/AmericanWoodmark, name "American Woodmark") lists
  http://woodmark.com as its blog/website field.
